name: Verify SDK & Publish Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python SDK scripts & JSON schemas
        run: |
          python3 -m py_compile examples/*.py
          python3 -c 'import glob, json; [json.load(open(f)) for f in glob.glob("n8n/*.json") + glob.glob("samples/*.json") + glob.glob("notebooks/*.ipynb")]'

      - name: Build starter-kit release bundle (unitbytes-1688-wholesale-scraper-api-starter-kit.zip)
        run: |
          zip -r "unitbytes-1688-wholesale-scraper-api-starter-kit.zip" README.md requirements.txt LICENSE SECURITY.md examples/ notebooks/ n8n/ samples/

      - name: Sync clean v1.0.0 & v1.1.0 GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          TITLE_CLEAN: "🇨🇳 1688.com Wholesale, Factory & Reverse Image Search Scraper + REST API Suite (`$1.50 / 1K`)"
          ZIP_NAME: "unitbytes-1688-wholesale-scraper-api-starter-kit.zip"
        run: |
          python3 - << 'PYEOF'
          import json, os, subprocess, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO_FULL"]
          title_clean = os.environ["TITLE_CLEAN"]
          zip_name = os.environ["ZIP_NAME"]
          notes_v110 = open(".github/RELEASE_NOTES.md", "r", encoding="utf-8").read()
          notes_v100 = notes_v110.replace("v1.1.0 Release Notes", "v1.0.0 Release Notes", 1)

          def gh_api(method, path, payload=None):
              url = f"https://api.github.com{path}"
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "unitbytes-release-bot",
              }
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  b = r.read().decode("utf-8")
                  return json.loads(b) if b else {}

          rels = gh_api("GET", f"/repos/{repo}/releases")
          by_tag = {r["tag_name"]: r for r in rels}

          if "v1.0.0" in by_tag:
              r100 = by_tag["v1.0.0"]
              gh_api("PATCH", f"/repos/{repo}/releases/{r100['id']}", {
                  "name": f"UnitBytes {title_clean} — v1.0.0 Release",
                  "body": notes_v100,
              })

          rel_name_110 = f"UnitBytes {title_clean} — v1.1.0 (Colab, MCP, RapidAPI/Zyla & 9-Node n8n Suite)"
          if "v1.1.0" in by_tag:
              r110 = by_tag["v1.1.0"]
              gh_api("PATCH", f"/repos/{repo}/releases/{r110['id']}", {
                  "name": rel_name_110,
                  "body": notes_v110,
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })
          else:
              gh_api("POST", f"/repos/{repo}/releases", {
                  "tag_name": "v1.1.0",
                  "target_commitish": "main",
                  "name": rel_name_110,
                  "body": notes_v110,
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })

          subprocess.run(["gh", "release", "upload", "v1.1.0", zip_name, "--clobber", "--repo", repo], check=True)
          PYEOF
